# Production deploy for fixyourdocs.io / api.fixyourdocs.io /
# mcp.fixyourdocs.io / docsfeedback.org. Runs CDK against `us-east-1`
# (CloudFront ACM cert constraint, locked by SPEC.md §3 + §4).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_DEPLOYER_ROLE_ARN              — arn:aws:iam::<account>:role/gh-actions-deployer
#                                          (provisioned by FydGithubOidcStack)
#   FYD_HOSTED_ZONE_ID                  — Route 53 zone id for fixyourdocs.io
#   FYD_DOCSFEEDBACK_HOSTED_ZONE_ID     — Route 53 zone id for docsfeedback.org
#   FYD_OPS_ALERT_EMAIL                 — email subscribed to the monitoring SNS topic
#
# OIDC trust: the role only trusts `repo:fixyourdocs/fixyourdocs:*` per
# `infra/lib/github-oidc-stack.ts`, so this workflow cannot run from a
# fork.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      FYD_ROOT_DOMAIN: fixyourdocs.io
      FYD_HOSTED_ZONE_ID: ${{ secrets.FYD_HOSTED_ZONE_ID }}
      FYD_DOCSFEEDBACK_HOSTED_ZONE_ID: ${{ secrets.FYD_DOCSFEEDBACK_HOSTED_ZONE_ID }}
      FYD_OPS_ALERT_EMAIL: ${{ secrets.FYD_OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm --filter @fyd/frontend build
      # Typecheck + tests are enforced by ci.yml on the PR that
      # produced this commit. Re-running them here would double the
      # deploy time without adding signal.

      - name: Assume the gh-actions-deployer role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve CDK_DEFAULT_ACCOUNT from the assumed role
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_ACCOUNT=${ACCOUNT}" >> "$GITHUB_ENV"

      - name: cdk deploy --all
        working-directory: infra
        run: pnpm exec cdk deploy --all --require-approval never

      - name: Smoke-test the deployed surface
        run: |
          set -euo pipefail
          fail=0

          check() {
            local url=$1
            local expect=$2
            local got
            got=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")
            if [ "$got" != "$expect" ]; then
              echo "::error::smoke-test FAIL: $url returned $got (expected $expect)"
              fail=1
            else
              echo "smoke-test OK: $url → $got"
            fi
          }

          check "https://fixyourdocs.io/"                       200
          check "https://api.fixyourdocs.io/public/domains"     200
          check "https://docsfeedback.org/"                     200

          # MCP endpoint: a bare GET should return a non-5xx (handler-defined; commonly 405 or 400).
          mcp_code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 https://mcp.fixyourdocs.io/mcp || echo "000")
          if [ "$mcp_code" = "000" ] || [ "${mcp_code:0:1}" = "5" ]; then
            echo "::error::smoke-test FAIL: https://mcp.fixyourdocs.io/mcp returned $mcp_code"
            fail=1
          else
            echo "smoke-test OK: https://mcp.fixyourdocs.io/mcp → $mcp_code"
          fi

          exit "$fail"
