name: CI
on:
  pull_request: {}
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @fyd/backend test
      - run: pnpm --filter @fixyourdocs/mcp-server test
      - run: pnpm --filter @fixyourdocs/mcp-server build
      - run: pnpm --filter @fyd/frontend build
